<title>Opening hours</title>
<style>

<tr><td>Monday</td><td>09:00</td><td>18:00</td></tr>
<tr><td>Tuesday</td><td>09:00</td><td>18:00</td></tr>
<tr><td>Wednesday</td><td>09:00</td><td>20:00</td></tr>
<tr><td>Thursday</td><td>09:00</td><td>18:00</td></tr>
<tr><td>Friday</td><td>09:00</td><td>18:00</td></tr>
<tr><td>Saturday</td><td>09:00</td><td>17:00</td></tr>
<tr><td>Sunday</td><td>Closed</td><td>Closed</td></tr>
</table>
</body>
